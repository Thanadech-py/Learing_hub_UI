<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // If a deep link is accessed directly without hash, redirect to index.html with hash
      var path = window.location.pathname;
      var repoMatch = path.match(/^\/([^/]+)/);
      var repo = repoMatch ? repoMatch[0] : '';
      var subpath = path.slice(repo.length);
      window.location.replace(repo + '/#' + subpath + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./">home</a>...</p>
  </body>
</html>
